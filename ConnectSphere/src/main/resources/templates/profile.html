<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Profile · ConnectSphere</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">✳</span> ConnectSphere</a><div class="top-actions"><a class="text-btn" href="/">← Back to feed</a><form action="/logout" method="post"><button class="text-btn" type="submit">Log out</button></form></div></header><main class="profile-page"><div class="profile-cover"></div><section class="profile-main card"><div class="profile-avatar avatar big" th:text="${#strings.substring(profile.displayName,0,1).toUpperCase()}">Y</div><div class="profile-top"><div><h1 th:text="${profile.displayName}">Name</h1><p class="muted" th:text="'@'+${profile.username}">@handle</p></div><div th:if="${profile.id != me.id}"><form th:action="@{'/users/'+${profile.id}+'/follow'}" method="post"><button class="btn primary" type="submit" th:text="${isFollowing?'Following ✓':'Follow +' }">Follow</button></form></div></div><p class="profile-bio" th:text="${profile.bio==null or profile.bio.isBlank()?'Still writing their story.':profile.bio}">Bio</p><div class="stats"><div><strong th:text="${follows.countByFollower(profile)}">0</strong><span>Following</span></div><div><strong th:text="${follows.countByFollowing(profile)}">0</strong><span>Followers</span></div><div><strong th:text="${posts.size()}">0</strong><span>Posts</span></div></div><div class="alert" th:if="${error}" th:text="${error}"></div><div class="success" th:if="${success}" th:text="${success}"></div><form class="edit-profile" th:if="${profile.id == me.id}" action="/profile/update" method="post"><h3>Edit your profile</h3><label>Display name<input name="displayName" required maxlength="60" th:value="${profile.displayName}"></label><label>Bio<textarea name="bio" maxlength="500" th:text="${profile.bio}" placeholder="What should people know about you?"></textarea></label><label>Avatar image URL <span class="muted">(optional)</span><input name="avatarUrl" type="url" th:value="${profile.avatarUrl}" placeholder="https://…"></label><button class="btn soft" type="submit">Save profile</button></form></section><section class="profile-posts"><div class="feed-label"><h2 th:text="${profile.displayName+'’s posts'}">Posts</h2><span th:text="${posts.size()+' posts'}">0 posts</span></div><article class="post card" th:each="post : ${posts}"><div class="post-head"><div class="avatar" th:text="${#strings.substring(post.author.displayName,0,1).toUpperCase()}">A</div><div class="post-author"><a th:href="@{'/profile/'+${post.author.username}}" th:text="${post.author.displayName}">Author</a><span th:text="'@'+${post.author.username}">@handle</span></div><time th:text="${#temporals.format(post.createdAt,'dd MMM · HH:mm')}">date</time></div><p class="post-content" th:text="${post.content}">Content</p><img class="post-image" th:if="${post.imageUrl != null and !post.imageUrl.isBlank()}" th:src="${post.imageUrl}" alt="Post attachment"><div class="post-actions"><form th:action="@{'/posts/'+${post.id}+'/like'}" method="post"><button class="action-btn" type="submit">♡ <span th:text="${likes.countByPost(post)}">0</span> <small>likes</small></button></form><span class="action-btn">☏ <span th:text="${comments.countByPost(post)}">0</span> <small>comments</small></span></div><div class="comments" th:if="${comments.countByPost(post)>0}"><div class="comment" th:each="comment : ${comments.findByPostOrderByCreatedAtAsc(post)}"><b th:text="${comment.author.displayName}">Name</b><span th:text="${comment.content}">Comment</span></div></div><form class="comment-form" th:action="@{'/posts/'+${post.id}+'/comments'}" method="post"><input name="content" maxlength="1000" required placeholder="Leave a thoughtful comment…"><button type="submit">↗</button></form></article><div class="empty-state card" th:if="${posts.isEmpty()}"><div class="empty-icon">✳</div><h3>No posts yet</h3><p>When they share something, it will appear here.</p><a class="btn soft" href="/">Explore the feed</a></div></section></main></body></html>

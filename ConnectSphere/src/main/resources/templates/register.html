<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Join · ConnectSphere</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="auth-page"><div class="auth-wrap"><a class="brand brand-large" href="/"><span class="brand-mark">✳</span> ConnectSphere</a><section class="auth-card"><div class="eyebrow">MAKE YOURSELF AT HOME</div><h1>Find your people.</h1><p class="muted">Create your corner of the internet.</p><div class="alert" th:if="${error}" th:text="${error}"></div><form method="post" action="/register" class="stack"><label>Display name<input name="displayName" required maxlength="60" placeholder="How people know you"></label><label>Username<input name="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_.]+" placeholder="your.handle"></label><label>Email<input name="email" type="email" required placeholder="you@example.com"></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></label><button class="btn primary full" type="submit">Create account <span>→</span></button></form><p class="auth-foot">Already part of the circle? <a href="/login">Sign in</a></p></section></div></body></html>

<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · ConnectSphere</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body class="auth-page"><div class="auth-wrap"><a class="brand brand-large" href="/"> <span class="brand-mark">✳</span> ConnectSphere</a><section class="auth-card"><div class="eyebrow">YOUR PEOPLE. YOUR WORLD.</div><h1>Good to see you.</h1><p class="muted">Sign in and pick up where your community left off.</p><div class="alert" th:if="${error}" th:text="${error}"></div><form method="post" action="/login" class="stack"><label>Username<input name="username" required autocomplete="username" placeholder="e.g. yashgaur"></label><label>Password<input name="password" type="password" required autocomplete="current-password" placeholder="Your password"></label><button class="btn primary full" type="submit">Sign in <span>→</span></button></form><p class="auth-foot">New around here? <a href="/register">Create an account</a></p></section><p class="tiny centered">A little less scrolling alone. A little more connecting.</p></div></body></html>
